<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrevista CAPS Ángel Bó</title>
<style>
  :root{--bg:#eeecfb;--card:#fff;--txt:#1d1b20;--sub:#5f5b6b;--pri:#5a43e0;--line:#d8d5e6;--rec:#d93025}
  @media (prefers-color-scheme: dark){:root{--bg:#14121c;--card:#201d2b;--txt:#ece9f6;--sub:#a9a4bb;--pri:#9b8cff;--line:#3a3550}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding:12px 12px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 auto 12px;max-width:720px}
  h1{margin:0 0 8px;font-size:1.5rem}
  h2{margin:0 0 4px;font-size:1.05rem;color:var(--pri)}
  .q{font-size:1rem;margin:6px 0 8px;font-weight:600}
  .hint{font-size:.9rem;color:var(--sub);margin:0 0 8px;padding-left:18px}
  .hint li{margin:2px 0}
  textarea,input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;color:var(--txt);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px}
  textarea{min-height:90px;resize:vertical}
  label.opt{display:flex;gap:10px;align-items:center;padding:8px 2px;font-size:1rem}
  label.opt input{width:20px;height:20px}
  .other{margin-top:4px}
  .row{display:flex;gap:8px;align-items:center;margin-top:6px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
  .mic{background:var(--pri);color:#fff}
  .mic.on{background:var(--rec);animation:p 1s infinite}
  @keyframes p{50%{opacity:.6}}
  .status{font-size:.85rem;color:var(--sub)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .bar button{background:var(--pri);color:#fff}
  .bar .sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
  .consent{background:#f3f1ff;border-radius:10px;padding:10px;font-size:.95rem;color:#1d1b20}
  @media (prefers-color-scheme: dark){.consent{background:#2a2640;color:var(--txt)}}
</style>
</head>
<body>

<div class="card">
  <h1>Entrevista CAPS Ángel Bó</h1>
  <div class="consent" id="intro"></div>
</div>

<div id="form"></div>

<div class="bar">
  <button id="btnDoc">Descargar Word (.docx)</button>
  <button id="btnCopy">Copiar texto</button>
  <button id="btnTxt">Descargar .txt</button>
  <button class="sec" id="btnClear">Borrar todo</button>
</div>

<script>
/* ============================================================
   PREGUNTAS
   type: text | date | number | area (respuesta larga con micrófono)
         radio | check  (opciones; other:true agrega "Otro: ____")
   hint: puntos a indagar (se muestran en lista chica)
   ============================================================ */
const SECTIONS = [
 {title:"Consentimiento", qs:[
  {id:"c1", q:"¿Está de acuerdo en participar y en que grabemos esta entrevista?", type:"radio", opts:["Sí","No"]}
 ]},
 {title:"1. Identificación de la entrevista", qs:[
  {id:"1.1", q:"1.1 Comisión en la que estoy inscripto:", type:"text"},
  {id:"1.2", q:"1.2 Fecha de realización de la entrevista:", type:"date"},
  {id:"1.3", q:"1.3 Nombre y Apellido del estudiante:", type:"text"}
 ]},
 {title:"2. Datos del CAPS", qs:[
  {id:"2.1", q:"2.1 Nombre del EFECTOR de Salud:", type:"text"},
  {id:"2.2", q:"2.2 Dirección:", type:"text"},
  {id:"2.3", q:"2.3 Localidad:", type:"text"},
  {id:"2.4", q:"2.4 Horario de Atención:", type:"text"},
  {id:"2.5", q:"2.5 Tipo de dependencia institucional del efector:", type:"radio", opts:["Nacional","Provincial","Municipal"], other:true}
 ]},
 {title:"3. Datos del entrevistado", qs:[
  {id:"3.1", q:"3.1 Nombre:", type:"text"},
  {id:"3.2", q:"3.2 Actividad que desarrolla en el centro de salud:", type:"text"},
  {id:"3.3", q:"3.3 ¿Desde qué año trabaja en el centro de salud?", type:"number"},
  {id:"3.4", q:"3.4 Título profesional:", type:"text"}
 ]},
 {title:"4. Modalidad de atención y acceso", qs:[
  {id:"4.1", q:"4.1 ¿Cómo es actualmente la modalidad de atención en el CAPS?", type:"area"},
  {id:"4.2", q:"4.2 ¿La atención es principalmente programada, espontánea o combinada?", type:"radio", opts:["Programada","Espontánea","Combinada"], area:true},
  {id:"4.3", q:"4.3 ¿Cómo se organizan las consultas?", type:"area"},
  {id:"4.4", q:"4.4 ¿Se realizan controles periódicos de salud?", type:"area"},
  {id:"4.5", q:"4.5 ¿Observan dificultades para que la población pueda acceder y sostener los controles de salud?", type:"area"},
  {id:"4.6", q:"4.6 ¿Cuáles son las principales dificultades?", type:"area",
   hint:["¿Horarios laborales?","¿Distancia o transporte?","¿Dificultades económicas?","¿Falta de turnos?","¿Otras situaciones?"]}
 ]},
 {title:"5. Demanda vinculada con hipertensión arterial", qs:[
  {id:"5.1", q:"5.1 ¿La hipertensión arterial representa una demanda frecuente dentro del CAPS? ¿Cómo se presenta habitualmente?", type:"area"},
  {id:"5.2", q:"5.2 ¿De qué manera llegan al CAPS las personas con hipertensión arterial?", type:"area"},
  {id:"5.3", q:"5.3 ¿Llegan con un diagnóstico previo?", type:"area"},
  {id:"5.4", q:"5.4 ¿Se detectan casos a partir de controles realizados en el CAPS?", type:"area"},
  {id:"5.5", q:"5.5 ¿También llegan por consultas por otros motivos y se detectan valores elevados de presión arterial?", type:"area"},
  {id:"5.6", q:"5.6 ¿Cómo se realiza el seguimiento de una persona con hipertensión arterial una vez identificado el problema?", type:"area"},
  {id:"5.7", q:"5.7 ¿Se realizan controles periódicos?", type:"radio", opts:["SI","No"], area:true},
  {id:"5.8", q:"5.8 ¿Quiénes participan del seguimiento?", type:"area"},
  {id:"5.9", q:"5.9 ¿Se registra y monitorea la evolución de los pacientes?", type:"area"},
  {id:"5.10", q:"5.10 ¿Cómo se procede ante valores elevados de presión arterial?", type:"area"},
  {id:"5.11", q:"5.11 ¿Qué dificultades encuentran para lograr que las personas con HTA mantengan sus controles y tratamiento?", type:"area",
   hint:["¿Hay dificultades para asistir a los turnos?","¿Para retirar o acceder a la medicación?","¿Para sostener cambios en la alimentación, actividad física u otros hábitos?","¿Se observan abandonos o interrupciones del seguimiento?"]},
  {id:"5.12", q:"5.12 ¿Qué estrategias utilizan desde el CAPS para favorecer la adherencia al tratamiento y al seguimiento de las personas con HTA?", type:"area"}
 ]},
 {title:"6. Prevención y promoción de la salud", qs:[
  {id:"6.1", q:"6.1 Además del tratamiento de la hipertensión ya diagnosticada, ¿qué acciones de prevención y promoción realizan relacionadas con la HTA y sus factores de riesgo?", type:"area"},
  {id:"6.2", q:"6.2 ¿Se realizan controles de presión arterial en personas que concurren por otros motivos?", type:"area",
   hint:["¿En qué situaciones?","¿Quién los realiza?","¿Qué sucede cuando se detecta un valor elevado?"]},
  {id:"6.3", q:"6.3 ¿Se realizan actividades de educación para la salud relacionadas con alimentación, actividad física, tabaquismo, consumo de alcohol, estrés u otros factores vinculados con la HTA?", type:"area",
   hint:["¿Son individuales o grupales?","¿Qué profesionales participan?"]}
 ]},
 {title:"7. Articulación y red de atención", qs:[
  {id:"7.1", q:"7.1 Cuando una persona con HTA necesita una atención que el CAPS no puede resolver, ¿cómo se realiza la derivación?", type:"area",
   hint:["¿Con qué instituciones o servicios se articula?","¿Existe comunicación entre el CAPS y el segundo nivel de atención?","¿Se realiza seguimiento luego de la derivación?"]},
  {id:"7.2", q:"7.2 ¿Cómo es la articulación con otros efectores o recursos comunitarios del territorio?", type:"area",
   hint:["Hospitales.","Otros centros de salud.","Espacios comunitarios.","Instituciones educativas.","Clubes u organizaciones barriales."]}
 ]},
 {title:"8. Características del territorio y determinantes", qs:[
  {id:"8.1", q:"8.1 ¿Cómo describiría las principales características del territorio que abarca el CAPS?", type:"area"},
  {id:"8.2", q:"8.2 ¿Qué condiciones sociales, económicas o ambientales considera que influyen en la salud de la población que atienden?", type:"check",
   opts:["Situación laboral.","Ingresos.","Alimentación.","Condiciones habitacionales.","Acceso al transporte.","Espacios para realizar actividad física."], other:true},
  {id:"8.3", q:"8.3 Desde su experiencia, ¿Hay características particulares del territorio que puedan favorecer o dificultar la prevención y el control de la hipertensión arterial?", type:"area"},
  {id:"8.4", q:"8.4 ¿Considera que existen grupos de la población con mayor riesgo de presentar HTA o con mayores dificultades para acceder al diagnóstico y tratamiento? ¿Por qué?", type:"area"}
 ]},
 {title:"9. Para finalizar", qs:[
  {id:"9.1", q:"9.1 Desde su experiencia, ¿Cuáles considera que son actualmente las principales dificultades para abordar la hipertensión arterial en este CAPS?", type:"area"},
  {id:"9.2", q:"9.2 ¿Qué recursos o estrategias considera que sería importante fortalecer para mejorar la prevención, detección y seguimiento de la HTA en la población?", type:"area"},
  {id:"9.3", q:"9.3 ¿Hay algún aspecto relacionado con la hipertensión arterial, la población o el funcionamiento del CAPS que considere importante agregar y que no hayamos preguntado?", type:"area"}
 ]}
];

const INTRO = `Buenos días / buenas tardes. Mi nombre es ____ y soy estudiante de la Licenciatura en ____ de la Universidad Nacional de Hurlingham.<br><br>
En el marco de nuestras prácticas comunitarias, estamos realizando entrevistas a profesionales / responsables de Centros de Atención Primaria de la Salud.<br><br>
El objetivo de esta entrevista es conocer la organización, los servicios, los recursos y la vinculación del CAPS con la comunidad. La información que nos brinde será utilizada únicamente con fines académicos y de formación, y no tendrá ningún uso externo a la Universidad.<br><br>
La entrevista será grabada para facilitar el registro, pero los datos serán tratados con absoluta confidencialidad.`;
document.getElementById('intro').innerHTML = INTRO;

/* ============================================================
   ESTADO + GUARDADO AUTOMÁTICO
   ============================================================ */
const KEY = 'entrevista_caps_v1';
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ data = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

/* ============================================================
   DICTADO (voz a texto)
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null, activeBtn = null;

function stopDictation(){
  if(activeRec){ activeRec.manual = true; try{activeRec.stop();}catch(e){} }
  if(activeBtn){ activeBtn.classList.remove('on'); activeBtn.textContent = '🎤 Dictar'; }
  activeRec = null; activeBtn = null;
}

function startDictation(ta, btn, status){
  if(!SR){ status.textContent = 'Este navegador no tiene dictado. Usá el micrófono del teclado del celular.'; return; }
  if(activeBtn === btn){ stopDictation(); status.textContent=''; return; }
  stopDictation();

  const rec = new SR();
  rec.lang = 'es-AR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.manual = false;
  let base = ta.value;

  rec.onresult = (ev)=>{
    let t = '';
    for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
    const sep = base && !/\s$/.test(base) ? ' ' : '';
    ta.value = base + sep + t.trim();
    ta.dispatchEvent(new Event('input'));
  };
  rec.onerror = (e)=>{
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      status.textContent = 'Permiso de micrófono denegado. Habilitalo en el navegador o usá el micrófono del teclado.';
      rec.manual = true; stopDictation();
    } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
      status.textContent = 'Error de dictado: ' + e.error;
    }
  };
  rec.onend = ()=>{
    // Chrome corta solo cada tanto: reiniciar mientras esté activo
    if(!rec.manual && activeRec === rec){
      base = ta.value;
      try{ rec.start(); }catch(e){}
    }
  };
  try{
    rec.start();
    activeRec = rec; activeBtn = btn;
    btn.classList.add('on'); btn.textContent = '⏹ Detener';
    status.textContent = 'Escuchando…';
  }catch(e){ status.textContent = 'No se pudo iniciar el micrófono.'; }
}

/* ============================================================
   RENDER
   ============================================================ */
const form = document.getElementById('form');

function el(tag, attrs={}, html=''){
  const e = document.createElement(tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html) e.innerHTML = html;
  return e;
}

function micArea(q, withLabel){
  const wrap = el('div');
  const ta = el('textarea', {placeholder: withLabel || 'Escribí o dictá la respuesta…'});
  ta.value = data[q.id + (withLabel ? '_txt' : '')] || '';
  const k = q.id + (withLabel ? '_txt' : '');
  ta.addEventListener('input', ()=>{ data[k] = ta.value; save(); });
  const row = el('div', {class:'row'});
  const btn = el('button', {class:'mic', type:'button'}, '🎤 Dictar');
  const st = el('span', {class:'status'});
  btn.addEventListener('click', ()=> startDictation(ta, btn, st));
  row.append(btn, st);
  wrap.append(ta, row);
  return wrap;
}

SECTIONS.forEach(sec=>{
  const card = el('div', {class:'card'});
  card.append(el('h2', {}, sec.title));

  sec.qs.forEach(q=>{
    const box = el('div', {style:'margin-top:14px'});
    box.append(el('div', {class:'q'}, q.q));

    if(q.hint){
      const ul = el('ul', {class:'hint'});
      q.hint.forEach(h=> ul.append(el('li', {}, h)));
      box.append(ul);
    }

    if(q.type === 'text' || q.type === 'date' || q.type === 'number'){
      const inp = el('input', {type:q.type, placeholder:'Tu respuesta'});
      inp.value = data[q.id] || '';
      inp.addEventListener('input', ()=>{ data[q.id] = inp.value; save(); });
      box.append(inp);
    }

    else if(q.type === 'area'){
      const ta = micArea(q);
      box.append(ta);
    }

    else if(q.type === 'radio' || q.type === 'check'){
      const multi = q.type === 'check';
      const saved = data[q.id] || (multi ? [] : '');
      const opts = q.opts.slice();
      if(q.other) opts.push('Otro');

      let otherInput = null;
      if(q.other){
        otherInput = el('input', {type:'text', class:'other', placeholder:'Otro: ¿cuál?'});
        otherInput.value = data[q.id + '_otro'] || '';
        otherInput.addEventListener('input', ()=>{ data[q.id + '_otro'] = otherInput.value; save(); });
      }

      opts.forEach(o=>{
        const lab = el('label', {class:'opt'});
        const inp = el('input', {type: multi ? 'checkbox' : 'radio', name:'q_'+q.id, value:o});
        inp.checked = multi ? saved.includes(o) : saved === o;
        inp.addEventListener('change', ()=>{
          if(multi){
            const cur = new Set(data[q.id] || []);
            inp.checked ? cur.add(o) : cur.delete(o);
            data[q.id] = [...cur];
          } else {
            data[q.id] = o;
          }
          save();
        });
        lab.append(inp, document.createTextNode(o));
        box.append(lab);
      });
      if(otherInput) box.append(otherInput);

      if(q.area){
        box.append(el('div', {class:'status', style:'margin-top:6px'}, 'Observaciones (opcional):'));
        box.append(micArea(q, 'Observaciones…'));
      }
    }

    card.append(box);
  });
  form.append(card);
});

/* ============================================================
   EXPORTAR
   ============================================================ */
function buildText(){
  let out = 'ENTREVISTA CAPS ÁNGEL BÓ\n\n';
  SECTIONS.forEach(sec=>{
    out += '== ' + sec.title + ' ==\n';
    sec.qs.forEach(q=>{
      let ans = data[q.id];
      if(Array.isArray(ans)) ans = ans.join(', ');
      if(q.other && data[q.id + '_otro']) ans = (ans ? ans + ' — ' : '') + 'Otro: ' + data[q.id + '_otro'];
      if(data[q.id + '_txt']) ans = (ans ? ans + ' — ' : '') + data[q.id + '_txt'];
      out += q.q + '\n  → ' + (ans || '(sin respuesta)') + '\n\n';
    });
  });
  return out;
}

document.getElementById('btnCopy').onclick = async ()=>{
  const t = buildText();
  try{ await navigator.clipboard.writeText(t); alert('Copiado'); }
  catch(e){ prompt('Copiá este texto:', t); }
};

/* ---- Descargas (en la página publicada se usa la capacidad "downloads") ---- */
const dlP = (window.claude && claude.use) ? claude.use('downloads').catch(()=>null) : Promise.resolve(null);

async function saveFile(filename, data){
  const dl = await dlP;
  if(dl){
    try{ await dl.save({filename, data}); }
    catch(e){ if(!e || e.code !== 'declined') alert('No se pudo guardar el archivo.'); }
    return;
  }
  // Fuera de la página publicada (archivo abierto directo): descarga normal
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById('btnTxt').onclick = ()=> saveFile('entrevista-caps.txt', buildText());

/* ---- Word (.docx) sin librerías ---- */
const CRC_T = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}

function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  let csize = 0; central.forEach(x=> csize += x.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,csize,true); end.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function xe(s){
  return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function para(text, o={}){
  const rpr = '<w:rPr>' + (o.bold?'<w:b/>':'') + (o.italic?'<w:i/>':'') +
    (o.color?'<w:color w:val="'+o.color+'"/>':'') + (o.size?'<w:sz w:val="'+o.size+'"/>':'') + '</w:rPr>';
  const runs = String(text).split('\n').map((ln,i)=>
    '<w:r>'+rpr+(i?'<w:br/>':'')+'<w:t xml:space="preserve">'+xe(ln)+'</w:t></w:r>').join('');
  return '<w:p><w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after||80)+'"/>' +
    (o.indent?'<w:ind w:left="'+o.indent+'"/>':'') + '</w:pPr>' + runs + '</w:p>';
}

function buildDocx(){
  let body = para('Entrevista CAPS Ángel Bó', {bold:true, size:40, after:200});
  SECTIONS.forEach(sec=>{
    body += para(sec.title, {bold:true, size:28, color:'5A43E0', before:300, after:120});
    sec.qs.forEach(q=>{
      let ans = data[q.id];
      if(Array.isArray(ans)) ans = ans.join(', ');
      if(q.other && data[q.id + '_otro']) ans = (ans ? ans + ' — ' : '') + 'Otro: ' + data[q.id + '_otro'];
      if(data[q.id + '_txt']) ans = (ans ? ans + ' — ' : '') + data[q.id + '_txt'];
      body += para(q.q, {bold:true, before:120, after:20});
      body += ans ? para(ans, {indent:240, after:120})
                  : para('(sin respuesta)', {italic:true, color:'888888', indent:240, after:120});
    });
  });
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zipStore([
    {name:'[Content_Types].xml', text: X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},
    {name:'_rels/.rels', text: X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
